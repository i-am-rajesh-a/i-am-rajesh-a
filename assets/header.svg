<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="deepCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Vibrant Cyber Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glassmorphic Card Background -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- High-Tech Micro Dot Grid -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#38bdf8" fill-opacity="0.16" />
    </pattern>
  </defs>

  <style>
    .hero-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif; font-size: 64px; font-weight: 900; fill: #ffffff; letter-spacing: 3px; }
    .hero-title { font-family: 'Fira Code', 'Courier New', monospace; font-size: 19px; font-weight: 600; fill: #38bdf8; letter-spacing: 2px; }
    .hero-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #94a3b8; letter-spacing: 0.5px; }
    .stat-val { font-family: 'Fira Code', monospace; font-size: 20px; font-weight: 700; fill: #38bdf8; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 1px; }
    .status-text { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; fill: #4ade80; letter-spacing: 1.5px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="18" fill="url(#deepCanvas)" />
  <rect width="1200" height="360" rx="18" fill="url(#techGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="90" r="130" fill="#00f2fe" fill-opacity="0.10" filter="url(#ultraGlow)" />
  <circle cx="1020" cy="270" r="150" fill="#818cf8" fill-opacity="0.12" filter="url(#ultraGlow)" />

  <!-- Outer Neon Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="url(#glassBorder)" stroke-width="1.5" />

  <!-- Circuit Trace Decors -->
  <path d="M 60,180 L 120,180 L 150,210 L 220,210" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.8" fill="none" />
  <circle cx="220" cy="210" r="4" fill="#38bdf8" fill-opacity="0.8" />
  <circle cx="60" cy="180" r="3" fill="#38bdf8" fill-opacity="0.5" />

  <path d="M 1140,180 L 1080,180 L 1050,150 L 980,150" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.8" fill="none" />
  <circle cx="980" cy="150" r="4" fill="#818cf8" fill-opacity="0.8" />
  <circle cx="1140" cy="180" r="3" fill="#818cf8" fill-opacity="0.5" />

  <!-- Central Glassmorphism Card Container -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Live Status Pill -->
    <rect x="-150" y="-115" width="300" height="30" rx="15" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="-120" cy="-100" r="4.5" fill="#22c55e" />
    <text x="10" y="-96" text-anchor="middle" class="status-text">AVAILABLE FOR SDE ROLES</text>

    <!-- Primary Name -->
    <text x="0" y="-20" class="hero-name">RAJESH A</text>

    <!-- Gradient Divider Line -->
    <rect x="-180" y="-3" width="360" height="3" rx="1.5" fill="url(#cyberCyan)" />

    <!-- Senior Engineering Title -->
    <text x="0" y="32" class="hero-title">FULL-STACK ENGINEER &bull; SYSTEMS &amp; AI BUILDER</text>
    <text x="0" y="60" class="hero-sub">Chennai Institute of Technology &bull; B.E. Computer Science &bull; CGPA: 9.37 / 10</text>
  </g>

  <!-- Bottom Metric Pods (Glassmorphic Badges) -->
  <g transform="translate(600, 295)">
    <!-- Pod 1: LeetCode Knight -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-24" width="190" height="48" rx="8" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1" />
      <text x="0" y="-4" text-anchor="middle" class="stat-val">1910 RATING</text>
      <text x="0" y="14" text-anchor="middle" class="stat-lbl">LEETCODE KNIGHT</text>
    </g>

    <!-- Pod 2: Problems Solved -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-24" width="190" height="48" rx="8" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1" />
      <text x="0" y="-4" text-anchor="middle" class="stat-val">1,420+ SOLVED</text>
      <text x="0" y="14" text-anchor="middle" class="stat-lbl">ALGORITHMIC RIGOR</text>
    </g>

    <!-- Pod 3: Global Rank -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-24" width="190" height="48" rx="8" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1" />
      <text x="0" y="-4" text-anchor="middle" class="stat-val">TOP 4.86%</text>
      <text x="0" y="14" text-anchor="middle" class="stat-lbl">GLOBAL STANDING</text>
    </g>

    <!-- Pod 4: CodeChef Stars -->
    <g transform="translate(360, 0)">
      <rect x="-95" y="-24" width="190" height="48" rx="8" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1" />
      <text x="0" y="-4" text-anchor="middle" class="stat-val">3★ CODER</text>
      <text x="0" y="14" text-anchor="middle" class="stat-lbl">CODECHEF (1615 MAX)</text>
    </g>
  </g>
</svg>
