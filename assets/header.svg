<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .name-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 58px; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
    .tagline { font-family: 'Fira Code', 'Courier New', monospace; font-size: 20px; font-weight: 500; fill: #94a3b8; letter-spacing: 1.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="80" r="120" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="140" fill="#6366f1" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Geometric Circuit Accents -->
  <path d="M 80,160 L 140,160 L 170,190 L 240,190" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none" />
  <circle cx="240" cy="190" r="4" fill="#38bdf8" fill-opacity="0.6" />

  <path d="M 1120,160 L 1060,160 L 1030,130 L 960,130" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2" fill="none" />
  <circle cx="960" cy="130" r="4" fill="#6366f1" fill-opacity="0.6" />

  <!-- Central Content -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Small Status Pill -->
    <rect x="-140" y="-46" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="-115" cy="-32" r="4" fill="#22c55e" />
    <text x="5" y="-28" text-anchor="middle" class="badge-text">OPEN FOR SDE INTERNSHIPS</text>

    <!-- Main Name Heading -->
    <text x="0" y="32" class="name-title">RAJESH A</text>

    <!-- Gradient Underline Bar -->
    <rect x="-160" y="48" width="320" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="90" class="tagline">FULL-STACK DEVELOPER &bull; AI ENTHUSIAST &bull; LEETCODE KNIGHT</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
