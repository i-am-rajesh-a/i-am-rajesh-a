<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 90" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="720" height="90" rx="10" fill="url(#quoteGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <text x="40" y="52" font-family="'Georgia', serif" font-size="44" fill="#38bdf8" font-weight="bold">“</text>
  <text x="65" y="48" font-family="'Courier New', monospace, sans-serif" font-size="16" fill="#f8fafc" font-style="italic">
    First, solve the problem. Then, write the code.
  </text>
  <text x="460" y="48" font-family="'Courier New', monospace, sans-serif" font-size="14" fill="#94a3b8">
    — John Johnson
  </text>
</svg>
